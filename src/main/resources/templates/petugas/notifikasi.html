<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifikasi Kurir - Jelantara</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/petugas.css}">
</head>
<body th:attr="data-flash-success=${flashSuccess},data-flash-error=${flashError}">
    <!-- Skeleton Shimmer Loading Overlay (Auto-dismiss & Non-blocking) -->
    <div id="jltSkeletonOverlay" class="jlt-skeleton-overlay">
        <div class="container" style="max-width: 720px;">
            <div class="jlt-card p-4">
                <div class="skeleton-box skeleton-line title mb-3"></div>
                <div class="skeleton-box skeleton-line short mb-4"></div>
                <div class="row g-3">
                    <div class="col-6"><div class="skeleton-box" style="height: 110px;"></div></div>
                    <div class="col-6"><div class="skeleton-box" style="height: 110px;"></div></div>
                </div>
            </div>
        </div>
    </div>
    <script>
        (function(){
            var el = document.getElementById('jltSkeletonOverlay');
            if(el){ setTimeout(function(){ el.style.opacity='0'; setTimeout(function(){ if(el && el.parentNode) el.parentNode.removeChild(el); }, 220); }, 250); }
        })();
    </script>


    <div class="app-layout flex-column flex-lg-row">
        <div th:replace="~{fragments/sidebar-nav :: petugas-sidebar('notifikasi', ${petugas})}"></div>

        <main class="app-main-content p-3 p-md-4 p-lg-5">
            <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
                <div>
                    <span class="badge-jlt-success">Halaman 3/3 • Pusat Notifikasi Kurir</span>
                    <h3 class="fw-bold mt-1 mb-0">Riwayat Pemberitahuan &amp; Penugasan</h3>
                </div>
                <button type="button" onclick="aktifkanPushNotification()" class="btn-jlt-secondary btn-sm">
                    <i data-lucide="bell-ring" style="width:16px;height:16px;"></i> Aktifkan Browser Push Notification
                </button>
            </div>

            <div class="jlt-card">
                <div th:if="${#lists.isEmpty(pesanList)}" class="text-center py-5">
                    <i data-lucide="bell-off" style="width:40px;height:40px;color:#B87B0A;" class="mb-2"></i>
                    <h6 class="fw-bold">Belum Ada Notifikasi Baru</h6>
                    <p class="small text-secondary mb-0">Instruksi penjemputan minyak dan pengantaran reward yang ditugaskan kepada Anda akan muncul di sini.</p>
                </div>

                <div class="d-flex flex-column gap-3" th:if="${!#lists.isEmpty(pesanList)}">
                    <div class="notif-item-card" th:each="msg : ${pesanList}">
                        <div class="d-flex flex-wrap justify-content-between align-items-center mb-1 gap-2">
                            <div class="d-flex align-items-center gap-2">
                                <span class="badge-jlt-success" th:text="${msg.tipe}">PENUGASAN</span>
                                <strong class="fs-6" th:text="${msg.judul}">Judul Notifikasi</strong>
                            </div>
                            <small class="text-secondary" th:text="${msg.tanggal}">2026-11-13</small>
                        </div>
                        <p class="small text-secondary mb-2" th:text="${msg.pesan}"></p>
                        <div class="d-flex flex-wrap gap-2" th:if="${msg.kategoriAksi != 'UMUM'}">
                            <a th:if="${msg.kategoriAksi == 'TRANSAKSI_MINYAK'}" th:href="@{/petugas/transaksi}" class="btn-jlt-primary btn-sm px-3">
                                Proses Tugas Jual Minyak &rarr;
                            </a>
                            <a th:if="${msg.kategoriAksi == 'REDEEM_POIN'}" th:href="@{/petugas/redeem}" class="btn-jlt-secondary btn-sm px-3">
                                Proses Pengantaran Redeem &rarr;
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
