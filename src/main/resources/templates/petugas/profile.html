<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Saya - Kurir Lapangan Jelantara</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/petugas.css}">
</head>
<body th:attr="data-flash-success=${flashSuccess},data-flash-error=${flashError}">

    <div class="app-layout flex-column flex-lg-row">
        <div th:replace="~{fragments/sidebar-nav :: petugas-sidebar('profile', ${petugas})}"></div>

        <main class="app-main-content p-3 p-md-4 p-lg-5">
            <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
                <div>
                    <span class="badge-jlt-success">Halaman 4/4 • Profil Operasional Kurir</span>
                    <h3 class="fw-bold mt-1 mb-0">Profil &amp; Pengaturan Akun Petugas</h3>
                </div>
            </div>

            <div class="row g-4">
                <div class="col-lg-4">
                    <div class="jlt-card text-center h-100">
                        <div class="rounded-circle d-inline-flex align-items-center justify-content-center fw-bold fs-2 mb-3 shadow-sm"
                             style="width:88px;height:88px;background:#FFCA00;color:#18181B;">
                            <i data-lucide="truck" style="width:40px;height:40px;"></i>
                        </div>
                        <h4 class="fw-bold mb-1" th:text="${petugas.namaPetugas}">Andi Pratama</h4>
                        <p class="small text-secondary mb-2" th:text="${petugas.email}">petugas@mail.com</p>
                        <span class="badge-jlt-success mb-3 d-inline-block" th:text="'Role: ' + ${petugas.role} + ' (' + ${petugas.status} + ')'">PETUGAS</span>

                        <div class="p-3 rounded-4 text-start mt-2" style="background:#FFFAE5;border:1px solid #FFE675;">
                            <div class="d-flex justify-content-between small mb-2">
                                <span class="text-secondary">No. Telepon:</span>
                                <strong th:text="${petugas.noTelp}">081234567890</strong>
                            </div>
                            <div class="d-flex justify-content-between small mb-2">
                                <span class="text-secondary">Beban Angkut Saat Ini:</span>
                                <strong th:text="${petugas.bebanAngkut} + ' / ' + ${petugas.kapasitasMaksimal} + ' L'">0 / 200 L</strong>
                            </div>
                            <div class="small">
                                <span class="text-secondary d-block">Alamat Domisili:</span>
                                <strong th:text="${petugas.alamat}">Jl. Merdeka No. 10</strong>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-lg-8">
                    <div class="jlt-card h-100">
                        <h5 class="fw-bold mb-3 pb-2 border-bottom">Edit Profil Petugas Kurir</h5>
                        <form th:action="@{/petugas/profile/update}" method="post" class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold small">Nama Lengkap Petugas <span class="text-danger">*</span></label>
                                <input type="text" name="namaPetugas" class="form-control" th:value="${petugas.namaPetugas}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold small">Email Login <span class="text-danger">*</span></label>
                                <input type="email" name="email" class="form-control" th:value="${petugas.email}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold small">Nomor Telepon / WhatsApp <span class="text-danger">*</span></label>
                                <input type="tel" name="noTelp" class="form-control" th:value="${petugas.noTelp}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold small">Password Baru (Kosongkan jika tidak diubah)</label>
                                <input type="password" name="passwordBaru" class="form-control" placeholder="••••••••">
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-semibold small">Alamat Domisili <span class="text-danger">*</span></label>
                                <textarea name="alamat" rows="2" class="form-control" required th:text="${petugas.alamat}"></textarea>
                            </div>
                            <div class="col-12 d-flex justify-content-end pt-2">
                                <button type="submit" class="btn-jlt-primary px-5">
                                    <i data-lucide="save" style="width:18px;height:18px;"></i> Simpan Perubahan Profil
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
