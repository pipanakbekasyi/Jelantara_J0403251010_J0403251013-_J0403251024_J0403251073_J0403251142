<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Jelantara</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body th:attr="data-flash-success=${flashSuccess},data-flash-error=${flashError}">
    <!-- Skeleton Shimmer Loading Overlay (Auto-dismiss & Non-blocking) -->
    <div id="jltSkeletonOverlay" class="jlt-skeleton-overlay">
        <div class="container" style="max-width: 720px;">
            <div class="jlt-card p-4">
                <div class="skeleton-box skeleton-line title mb-3"></div>
                <div class="skeleton-box skeleton-line short mb-4"></div>
                <div class="row g-3">
                    <div class="col-6"><div class="skeleton-box" style="height: 110px;"></div></div>
                    <div class="col-6"><div class="skeleton-box" style="height: 110px;"></div></div>
                </div>
            </div>
        </div>
    </div>
    <script>
        (function(){
            var el = document.getElementById('jltSkeletonOverlay');
            if(el){ setTimeout(function(){ el.style.opacity='0'; setTimeout(function(){ if(el && el.parentNode) el.parentNode.removeChild(el); }, 220); }, 250); }
        })();
    </script>

    <div class="row g-0 auth-split-wrapper">
        <div class="col-lg-6 auth-mascot-panel d-none d-lg-flex">
            <img src="/images/mascot-register.jpg" alt="Registrasi Jelantara" class="auth-mascot-img mb-4">
            <h2 class="fw-bold text-center">Bergabung Bersama Jelantara</h2>
            <p class="text-secondary text-center" style="max-width: 380px;">Dapatkan poin reward dari setiap liter minyak jelantah yang Anda setorkan.</p>
        </div>
        <div class="col-12 col-lg-6 d-flex align-items-center justify-content-center p-4 p-md-5">
            <div style="width: 100%; max-width: 400px;">
                
                    <div class="mb-3">
                        <a th:href="@{/}" class="text-secondary text-decoration-none small d-inline-flex align-items-center gap-1">
                            <i data-lucide="arrow-left" style="width:14px;height:14px;"></i> Kembali ke Beranda / Home
                        </a>
                    </div>
                <h2 class="fw-bold mb-3">Create Account</h2>
                <form th:action="@{/auth/register}" method="post">
                    <div class="mb-2">
                        <label class="form-label fw-semibold">Nama Lengkap</label>
                        <input type="text" name="namaPenjual" class="form-control" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label fw-semibold">Email</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label fw-semibold">Nomor HP</label>
                        <input type="text" name="noHp" class="form-control" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label fw-semibold">Alamat Penjemputan</label>
                        <input type="text" name="alamat" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn-jlt-primary w-100 py-3">REGISTER</button>
                    <div class="auth-divider"><span>or Log In with</span></div>
                    <p class="text-center small mb-0">Sudah punya akun? <a th:href="@{/login}" class="fw-bold text-dark">Log In</a></p>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
