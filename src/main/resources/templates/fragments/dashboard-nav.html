<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="dash-nav(activeTab)">
    <header class="bg-white border-bottom py-3 mb-4 sticky-top">
        <div class="container d-flex flex-wrap justify-content-between align-items-center gap-3">
            <a class="d-flex align-items-center gap-2 fw-bold fs-4 text-dark text-decoration-none" th:href="@{/}">
                <span class="d-inline-flex align-items-center justify-content-center rounded-circle" style="width: 38px; height: 38px; background-color: #FFCA00;">
                    <i data-lucide="droplet" style="width: 20px; height: 20px; color: #18181B;"></i>
                </span>
                <span>JELANTARA</span>
            </a>

            <div class="d-flex align-items-center gap-3">
                <span class="badge-amber-points d-flex align-items-center gap-1">
                    <i data-lucide="coins" style="width: 15px; height: 15px;"></i>
                    <span th:text="${saldoPoin != null ? saldoPoin : 450} + ' Poin'">450 Poin</span>
                </span>
                <a th:href="@{/auth/lengkapi-profil}" class="d-flex align-items-center gap-2 ps-2 border-start text-decoration-none text-dark" title="Edit Kelengkapan Profil">
                    <div class="rounded-circle d-flex align-items-center justify-content-center fw-bold" style="width: 40px; height: 40px; background-color: #F7B32E; color: #18181B;">
                        <span th:text="${userAktif != null ? #strings.substring(userAktif.username, 0, 1) : 'B'}">B</span>
                    </div>
                    <div class="d-none d-sm-block lh-sm">
                        <div class="fw-bold small" th:text="${userAktif != null ? userAktif.username : 'Budi Santoso'}">Budi Santoso</div>
                        <small class="text-muted" style="font-size: 11px;" th:text="${userAktif != null ? userAktif.kategori + ' • ' + userAktif.idUser : 'Rumah Tangga • PJL-001'}">Penjual</small>
                    </div>
                </a>
            </div>
        </div>
    </header>
</div>
</body>
</html>
