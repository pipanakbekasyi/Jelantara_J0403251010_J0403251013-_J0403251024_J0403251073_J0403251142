# Konfigurasi port server aplikasi
server.port=8080

# Konfigurasi koneksi ke database PostgreSQL 'jelantara'
spring.datasource.url=jdbc:postgresql://localhost:5432/jelantara
spring.datasource.username=postgres
spring.datasource.password=Bekasi168
spring.datasource.driver-class-name=org.postgresql.Driver

# Konfigurasi Hibernate JPA menyesuaikan skema tabel jelantara_projek.sql
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Konfigurasi upload file / foto kamera maksimal 10MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Menonaktifkan cache Thymeleaf selama pengembangan
spring.thymeleaf.cache=false

# Konfigurasi Google OAuth2 Client ID (Google Identity Services)
# Ganti dengan Client ID dari Google Cloud Console agar tombol Google Sign-In asli aktif
google.client.id=iniganti-client-id-anda.apps.googleusercontent.com
