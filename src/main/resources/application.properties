# Port: Render memberi PORT lewat environment variable, lokal tetap 8080
server.port=${PORT:8080}

# Database: dibaca dari environment variable, default ke database lokal
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/jelantara}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Lokal: update, hosting: none (struktur tabel mengikuti jelantara_full_v29.sql)
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.thymeleaf.cache=false

google.client.id=${GOOGLE_CLIENT_ID:425919592463-4vo8kjehfctemukd61bpr6e8a94eg7je.apps.googleusercontent.com}